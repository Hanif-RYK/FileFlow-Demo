if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
}

// ============================================================
//  RECYCLE BIN (SOFT DELETE / RESTORE)
// ============================================================
async function deleteStorageImage(imagePath) {
    if (!imagePath || !supaClient) return;
    try {
        let cleanPath = imagePath;
        if (imagePath.startsWith('http')) {
            const parts = imagePath.split('fileflow_images/');
            if (parts.length > 1) {
                cleanPath = decodeURIComponent(parts.slice(1).join('fileflow_images/').split('?')[0]);
            }
        }
        await supaClient.storage.from('fileflow_images').remove([cleanPath]);
    } catch(e) {
        console.warn('Storage image deletion warning:', e);
    }
}

// Delete every stored image referenced by a row (and a folder's documents).
async function deleteRowImages(row, docs) {
    const paths = [];
    [row, ...(docs || [])].forEach(r => {
        if (!r) return;
        if (r.image) paths.push(r.image);
        if (Array.isArray(r.images)) paths.push(...r.images);
        if (r.data && typeof r.data === 'string' && !r.data.startsWith('data:')) paths.push(r.data);
    });
    for (const p of new Set(paths)) await deleteStorageImage(p);
}

const BIN_TABLES = [
    { table: 'tasks',     type: 'task',     label: 'Task',     icon: '📋' },
    { table: 'files_out', type: 'checkout', label: 'Checkout', icon: '🖼️' },
    { table: 'folders',   type: 'folder',   label: 'Folder',   icon: '📁' },
    { table: 'documents', type: 'document', label: 'Document', icon: '📄' },
];
const BIN_RETENTION_MS = 30 * 24 * 60 * 60 * 1000;

// Fetch every row in the Recycle Bin that this user may see (RLS decides).
async function fetchBinItems() {
    const items = [];
    for (const t of BIN_TABLES) {
        const rows = dbError(await supaClient.from(t.table).select('*').not('deleted_at', 'is', null)
            .order('deleted_at', { ascending: false }).limit(500), `Loading ${t.label} bin`);
        (rows || []).forEach(r => items.push({ ...t, row: r, id: r.id, deletedAt: new Date(r.deleted_at).getTime(),
            title: r.title || r.name || 'Untitled' }));
    }
    // Documents removed together with their folder are shown (and restored) as part of the folder.
    const binFolders = new Map(items.filter(i => i.table === 'folders').map(i => [i.id, i.row.deleted_at]));
    return items.filter(i => !(i.table === 'documents' && binFolders.get(i.row.folder_id) === i.row.deleted_at))
                .sort((a, b) => b.deletedAt - a.deletedAt);
}

// Permanently delete one bin item and its stored images.
async function purgeBinItem(item) {
    let docs = [];
    if (item.table === 'folders') {
        docs = dbError(await supaClient.from('documents').select('*').eq('folder_id', item.id), 'Loading folder documents') || [];
    }
    dbError(await supaClient.from(item.table).delete().eq('id', item.id), `Deleting ${item.label}`);
    await deleteRowImages(item.row, docs);   // only after the row is really gone
}

let _binItems = [];
// Render the recycle bin list.
async function openRecycleBin(fromBack) {
    if(!fromBack) pushNav('recycleBin', {});
    showLoading('Loading Recycle Bin...');
    let trash = [];
    try {
        trash = await fetchBinItems();
        // Auto cleanup of items older than 30 days (rows this user may delete).
        const now = Date.now();
        const expired = trash.filter(i => now - i.deletedAt >= BIN_RETENTION_MS && canManageEntry(i.row.created_by));
        for (const item of expired) {
            try { await purgeBinItem(item); } catch (e) { console.warn('Recycle bin cleanup failed:', e); }
        }
        trash = trash.filter(i => !expired.includes(i));
    } catch (e) {
        showToast('Recycle Bin could not be loaded: ' + e.message, 'error');
    }
    _binItems = trash;
    hideLoading();
    
    const now = Date.now();
    let html = `
        <div class="header">
            <button class="back-btn" onclick="closeRecycleBin()" aria-label="Go back">←</button>
            <div class="header-content">
                <h1>Recycle Bin 🗑️</h1>
            </div>
            ${trash.length > 0 && window.userRole !== 'Viewer' ? `<button onclick="emptyTrashConfirm()" style="margin-left:auto;background:#dc2626;color:white;border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:700;">Empty Trash</button>` : ''}
        </div>
        <div class="card-wrapper" style="margin-top:20px; box-sizing:border-box;">
    `;
    
    if (trash.length === 0) {
        html += `
            <div style="text-align:center; padding:40px; color:var(--text-secondary); width:100%;">
                <div style="font-size:48px; margin-bottom:16px;">🗑️</div>
                <h3>Recycle Bin is Empty</h3>
                <p style="margin-top:8px;font-size:14px;">Deleted items will stay here for 30 days before being permanently deleted.</p>
            </div>
        `;
    } else {
        html += `<div style="display:flex; flex-direction:column; gap:12px; width:100%; padding:12px;">`;
        trash.forEach((item, idx) => {
            const daysLeft = Math.max(0, Math.ceil((BIN_RETENTION_MS - (now - item.deletedAt)) / 86400000));
            const canAct = canManageEntry(item.row.created_by) || item.row.deleted_by === window.currentUserId;
            html += `
            <div style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:16px; display:flex; justify-content:space-between; align-items:center; gap:10px;">
                <div style="display:flex; gap:12px; align-items:center; min-width:0;">
                    <div style="font-size:24px;">${item.icon}</div>
                    <div style="min-width:0;">
                        <div style="font-weight:600; color:var(--text-primary); overflow-wrap:anywhere;">${esc(item.title)}</div>
                        <div style="font-size:12px; color:var(--text-secondary); margin-top:4px;">
                            ${item.label} • Deleted ${new Date(item.deletedAt).toLocaleDateString()} (${daysLeft} days left)
                        </div>
                    </div>
                </div>
                ${canAct ? `<div style="display:flex; gap:8px; flex-shrink:0;">
                    <button onclick="restoreTrashItem(${idx})" aria-label="Restore" style="background:none; border:1px solid var(--border-color); border-radius:8px; padding:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;" title="Restore">↩️</button>
                    <button onclick="deleteTrashItemPermanently(${idx})" aria-label="Delete permanently" style="background:none; border:1px solid #dc2626; border-radius:8px; padding:8px; color:#dc2626; cursor:pointer; display:flex; align-items:center; justify-content:center;" title="Delete Permanently">🗑️</button>
                </div>` : ''}
            </div>
            `;
        });
        html += `</div>`;
    }
    html += `</div>`;
    
    const dv=document.getElementById('detailView');
    dv.innerHTML=html;
    hideDashboard();
    setTimeout(()=>pageShow(dv),60);
}

// Confirm emptying the recycle bin.
function emptyTrashConfirm() {
    showConfirmPopup('Empty Trash', 'Are you sure you want to permanently delete all items in the Recycle Bin?', () => doEmptyTrash());
}

// Permanently delete every bin item this user is allowed to delete.
async function doEmptyTrash() {
    showLoading('Emptying Trash...');
    let failed = 0;
    for (const item of _binItems.filter(i => canManageEntry(i.row.created_by))) {
        try { await purgeBinItem(item); } catch (e) { failed++; console.warn('Purge failed:', e); }
    }
    hideLoading();
    showToast(failed ? `${failed} item(s) could not be deleted.` : 'Recycle Bin emptied successfully.', failed ? 'error' : 'success');
    openRecycleBin(true);
}

// Restore an item from the recycle bin.
async function restoreTrashItem(idx) {
    const item = _binItems[idx];
    if (!item) { showToast('Item not found in Recycle Bin.', 'error'); return; }
    showLoading('Restoring item...');
    try {
        if (item.table === 'documents' && item.row.folder_id) {
            const { data: folder } = await supaClient.from('folders').select('id, deleted_at').eq('id', item.row.folder_id).maybeSingle();
            if (folder && folder.deleted_at) throw new Error('Restore its folder first.');
        }
        if (item.table === 'folders') {
            dbError(await supaClient.from('documents').update({ deleted_at: null })
                .eq('folder_id', item.id).eq('deleted_at', item.row.deleted_at), 'Restoring folder documents');
        }
        dbError(await supaClient.from(item.table).update({ deleted_at: null }).eq('id', item.id), `Restoring ${item.label}`);
        await loadAppData();
        loadCounts();
        showToast('Item restored successfully.', 'success');
        openRecycleBin(true);
    } catch(e) {
        showToast('Failed to restore item: ' + e.message, 'error');
    }
    hideLoading();
}

// Permanently delete a single recycle bin item.
function deleteTrashItemPermanently(idx) {
    const item = _binItems[idx];
    if (!item) { showToast('Item not found.', 'error'); return; }
    showConfirmPopup('Delete Permanently', 'Are you sure you want to permanently delete this item?', async () => {
        showLoading('Deleting item permanently...');
        try {
            await purgeBinItem(item);
            showToast('Item deleted permanently.', 'success');
            openRecycleBin(true);
        } catch(e) {
            showToast('Failed to delete item permanently: ' + e.message, 'error');
        }
        hideLoading();
    });
}
