// Save the Supabase URL and anon key to local storage.
function saveSupabaseConfig() {
    let rawUrl = document.getElementById('supaUrl').value.trim();
    if (!rawUrl) { showToast('Supabase URL is required.', 'error'); return; }
    let url = rawUrl;
    if (!url.startsWith('http')) url = 'https://' + url;
    url = url.replace(/\/+$/, '');
    url = url.replace(/\/rest\/v1$/, '');
    url = url.replace(/\/graphql\/v1$/, '');
    url = url.replace(/\/auth\/v1$/, '');
    try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'https:' || !parsed.hostname.endsWith('.supabase.co')) throw new Error('Invalid URL');
    } catch (e) {
        showToast('Enter a valid HTTPS Supabase URL.', 'error');
        return;
    }
    const key = document.getElementById('supaKey').value.trim();
    if (!key) { showToast('Supabase Anon Key is required.', 'error'); return; }
    localStorage.setItem('supabase_url', url);
    localStorage.setItem('supabase_key', key);
    window.location.reload();
}

let supaClient = null;
const _cache = {};
let initStage = 'Starting';

// Read a cached value by key.
async function dbGet(key) {
    return _cache[key] || null;
}

// Surface a Supabase error to the user via toast.
function dbError(result, operation) {
    if (result?.error) throw new Error(`${operation}: ${result.error.message}`);
    return result?.data;
}

// Build the per-user settings storage key.
function settingStorageKey(key) {
    if (!window.currentUserId) throw new Error('User session required for settings');
    return `${window.currentUserId}:${key}`;
}

// Map an app entry object to its database row shape.
function toDbRow(table, value, status) {
    if (table === 'files_out') {
        return {
            id: value.id,
            status: value.status || status || 'out',
            image: value.image || null,
            date_field: value.date_field || value.dateField || null,
            taken_by: value.taken_by || value.takenBy || null,
            name: value.name || null,
            mobile: value.mobile || null,
            duration: value.duration || null,
            due_date: value.due_date || value.expiresAt || null,
            returned_at: value.returned_at || value.returnedAt || null,
            title: value.title || null,
            nature: value.nature || null,
            company_code: value.company_code || (window.companyCode || null),
            created_by: value.created_by || (window.currentUserId || null),
            created_at: value.created_at || value.createdAt || new Date().toISOString()
        };
    }
    if (table === 'tasks') {
        return {
            id: value.id,
            status: value.status || 'not_started',
            title: value.title || null,
            description: value.description || value.taskDetails || null,
            assigned_to: value.assigned_to || value.assignedTo || null,
            assigned_by: value.assigned_by || value.assignedBy || null,
            next_assignee: value.next_assignee || value.nextAssignee || null,
            assignee_staff_ids: (value.assignee_staff_ids || []).map(Number).filter(Number.isFinite),
            workflow_type: value.workflow_type || value.workflowType || 'simple',
            has_steps: Boolean(value.has_steps ?? value.hasSteps),
            steps: value.steps || [],
            overall_progress: Number(value.overall_progress ?? value.overallProgress ?? 0),
            history: value.history || [],
            due_date: value.due_date || value.expiresAt || null,
            completed_at: value.completed_at || value.completedAt || null,
            created_at: value.created_at || value.createdAt || new Date().toISOString(),
            task_type: value.task_type || value.taskType || null,
            task_details: value.task_details || value.taskDetails || value.description || null,
            name: value.name || null,
            mobile: value.mobile || null,
            duration: value.duration || null,
            company_code: value.company_code || (window.companyCode || null),
            created_by: value.created_by || (window.currentUserId || null)
        };
    }
    if (table === 'folders') {
        return {
            id: value.id,
            category: value.category || 'englishFile',
            name: value.name || null,
            month: value.month || null,
            year: value.year || null,
            company_code: value.company_code || (window.companyCode || null),
            created_by: value.created_by || (window.currentUserId || null),
            created_at: value.created_at || value.createdAt || new Date().toISOString()
        };
    }
    if (table === 'documents') {
        return {
            id: value.id,
            folder_id: value.folder_id ?? value.folderId,
            category: value.category || 'englishFile',
            name: value.name || null,
            images: value.images || [],
            data: value.data || null,
            title: value.title || null,
            nature: value.nature || null,
            pages: value.pages ?? null,
            has_images: Boolean(value.has_images ?? value.hasImages ?? (value.images || []).length),
            company_code: value.company_code || (window.companyCode || null),
            created_by: value.created_by || (window.currentUserId || null),
            created_at: value.created_at || value.createdAt || new Date().toISOString()
        };
    }
    return value;
}

// Map a database row to the app's entry object shape.
function fromDbRow(table, value) {
    if (table === 'files_out') return {
        ...value,
        dateField: value.date_field,
        takenBy: value.taken_by,
        expiresAt: value.due_date,
        returnedAt: value.returned_at,
        createdAt: value.created_at,
        mode: 'fileMovement'
    };
    if (table === 'tasks') return {
        ...value,
        taskDetails: value.task_details || value.description,
        assignedTo: value.assigned_to,
        assignedBy: value.assigned_by,
        nextAssignee: value.next_assignee,
        workflowType: value.workflow_type,
        hasSteps: value.has_steps,
        overallProgress: value.overall_progress,
        expiresAt: value.due_date,
        completedAt: value.completed_at,
        createdAt: value.created_at,
        taskType: value.task_type,
        mode: 'assignedTask'
    };
    if (table === 'folders') return { ...value, createdAt: value.created_at };
    if (table === 'documents') return {
        ...value,
        folderId: value.folder_id,
        createdAt: value.created_at,
        hasImages: value.has_images
    };
    return value;
}

// Persist a local cache list to its database table via upsert.
async function dbSet(key, valueStr) {
    const arr = typeof valueStr === 'string' ? JSON.parse(valueStr) : valueStr;
    
    let table = null, status = null, category = null;
    if(key==='filesOut'){ table='files_out'; status='out'; }
    else if(key==='returnedFiles'){ table='files_out'; status='returned'; }
    else if(key==='overdueFiles'){ table='files_out'; status='overdue'; }
    else if(key==='pendingTasks'){ table='tasks'; status='pending'; }
    else if(key==='overdueTasks'){ table='tasks'; status='overdue'; }
    else if(key==='completedTasks'){ table='tasks'; status='completed'; }

    else if(key==='englishFile_folders'){ table='folders'; category='englishFile'; }
    else if(['appDefaultCountry', 'currentMode', 'currentEntryType'].includes(key)){ table='settings'; }

    if (!table) {
        _cache[key] = typeof valueStr === 'string' ? valueStr : JSON.stringify(valueStr);
        return;
    }

    try {
    if (table === 'settings') {
        dbError(await supaClient.from(table).upsert({ key: settingStorageKey(key), value: arr }), `Saving setting ${key}`);
        _cache[key] = typeof arr === 'string' ? arr : JSON.stringify(arr);
        return;
    }
    
    if (Array.isArray(arr) && arr.length > 0) {
        if (table === 'folders') {
            for (const f of arr) {
                dbError(await supaClient.from('folders').upsert(toDbRow('folders', { ...f, category })), 'Saving folder');
                const docs = f.documents || [];
                if (docs.length > 0) {
                    const docsToInsert = docs.map(d => toDbRow('documents', { ...d, folder_id: f.id, category }));
                    dbError(await supaClient.from('documents').upsert(docsToInsert), 'Saving documents');
                }
            }
        } else {
            const rows = arr.map(x => {
                const row = toDbRow(table, x, status);
                if (table === 'tasks' && !x.status) row.status = key === 'completedTasks' ? 'completed' : 'not_started';
                return row;
            });
            dbError(await supaClient.from(table).upsert(rows), `Saving ${table}`);
        }
    }
    
    // Never delete rows merely because they are absent from a local cache.
    // Deletes and status transitions must be explicit user actions.
    _cache[key] = typeof valueStr === 'string' ? valueStr : JSON.stringify(valueStr);
    } catch (e) {
        console.error('dbSet error:', key, e);
        throw e;
    }
}

// Remove a value from the local cache.
async function dbDel(key) {
    delete _cache[key];
}

// Move a row to the Recycle Bin (soft delete).
async function dbSoftDelete(table, id, operation, ts) {
    if (!supaClient || id === undefined || id === null) throw new Error(`${operation}: invalid record ID`);
    dbError(await supaClient.from(table).update({ deleted_at: ts || new Date().toISOString() }).eq('id', id), operation);
}

// Delete a database row by id.
async function dbDeleteRow(table, id, operation) {
    if (!supaClient || id === undefined || id === null) throw new Error(`${operation}: invalid record ID`);
    dbError(await supaClient.from(table).delete().eq('id', id), operation);
}

// Insert a single new row and return it as stored (the database assigns id,
// company_code, created_by and created_at).
async function dbInsertRow(table, row, operation) {
    if (!supaClient) throw new Error(`${operation}: database not connected`);
    const clean = { ...row };
    ['id', 'company_code', 'created_by', 'created_at'].forEach(k => delete clean[k]);
    return dbError(await supaClient.from(table).insert([clean]).select().single(), operation);
}

// Update one row by id with only its mutable columns.
async function dbUpdateRow(table, id, row, operation) {
    if (!supaClient || id === undefined || id === null) throw new Error(`${operation}: invalid record ID`);
    const patch = { ...row };
    ['id', 'company_code', 'created_by', 'created_at'].forEach(k => delete patch[k]);
    dbError(await supaClient.from(table).update(patch).eq('id', id), operation);
}

// Split checkouts into active / overdue / returned lists by status and due date.
function classifyCheckouts(list) {
    const now = new Date();
    const res = { filesOut: [], overdueFiles: [], returnedFiles: [] };
    list.forEach(f => {
        if (f.status === 'returned') res.returnedFiles.push(f);
        else if (f.expiresAt && new Date(f.expiresAt) < now) res.overdueFiles.push({ ...f, status: 'overdue' });
        else res.filesOut.push({ ...f, status: 'out' });
    });
    return res;
}

// Split tasks into pending / overdue / completed lists by status and due date.
function classifyTasks(list) {
    const now = new Date();
    const res = { pendingTasks: [], overdueTasks: [], completedTasks: [] };
    list.forEach(t => {
        // 'overdue' is derived from the due date, never a stored workflow status.
        if (t.status === 'overdue') t = { ...t, status: 'not_started' };
        if (t.status === 'completed') res.completedTasks.push(t);
        else if (t.expiresAt && new Date(t.expiresAt) < now) res.overdueTasks.push(t);
        else res.pendingTasks.push(t);
    });
    return res;
}

// Return the cache list key a task belongs to.
function taskListKey(task) {
    if (task.status === 'completed') return 'completedTasks';
    const due = task.expiresAt || task.due_date;
    return due && new Date(due) < new Date() ? 'overdueTasks' : 'pendingTasks';
}

// Remove a task from every cached task list and add it to the right one.
function placeTaskInCache(task) {
    for (const key of ['pendingTasks', 'overdueTasks', 'completedTasks']) {
        const list = JSON.parse(cacheGet(key) || '[]');
        _cache[key] = JSON.stringify(list.filter(t => t.id !== task.id));
    }
    const target = taskListKey(task);
    const list = JSON.parse(cacheGet(target) || '[]');
    list.push(task);
    _cache[target] = JSON.stringify(list);
}

// Initialize Supabase, load all data and render the dashboard.
async function dbLoadAll() {
    /* Removed blocking overlay */
    initStage = 'Authentication';
    if (!await initSupabase()) throw new Error('SUPABASE_NOT_CONFIGURED');

    // Retention cleanup must run as an audited server-side job, never on app startup.

    startTopLoader(); document.body.classList.add('skeleton-mode'); showToast('Syncing database...', 'success');
    initStage = 'Loading settings';
    const settingsResult = await supaClient.from('settings').select('*');
    // Preferences are optional. A missing or unmigrated settings table must not
    // prevent the operational parts of the app from opening.
    let settings = [];
    if (settingsResult.error) {
        console.warn('Settings could not be loaded:', settingsResult.error.message);
    } else {
        settings = settingsResult.data || [];
    }
    if (settings) {
        settings.forEach(s => {
            const prefix = `${window.currentUserId}:`;
            if (s.key.startsWith(prefix)) {
                _cache[s.key.slice(prefix.length)] = typeof s.value === 'string' ? s.value : JSON.stringify(s.value);
            }
        });
    }

    await loadAppData();
}

// Load (or reload) all operational data into the cache. Recycle-bin rows are excluded.
async function loadAppData() {
    initStage = 'Loading checkouts';
    const files = dbError(await supaClient.from('files_out').select('*').is('deleted_at', null).order('id', {ascending: false}).limit(1000), 'Loading checkouts');
    const fileGroups = classifyCheckouts((files || []).map(f => fromDbRow('files_out', f)));
    Object.keys(fileGroups).forEach(k => { _cache[k] = JSON.stringify(fileGroups[k]); });

    initStage = 'Loading tasks';
    const tasks = dbError(await supaClient.from('tasks').select('*').is('deleted_at', null).order('id', {ascending: false}).limit(1000), 'Loading tasks');
    const taskGroups = classifyTasks((tasks || []).map(t => fromDbRow('tasks', t)));
    Object.keys(taskGroups).forEach(k => { _cache[k] = JSON.stringify(taskGroups[k]); });

    initStage = 'Loading folders';
    await refreshFoldersCache();

    initStage = 'Loading staff & company';
    await refreshStaffAndRequests(true);
}

// Live updates: reload data when another user changes something in this company.
let _liveTimer = null, _liveChannel = null;
function startRealtime() {
    if (!supaClient || !supaClient.channel || _liveChannel) return;
    const onChange = () => {
        clearTimeout(_liveTimer);

    };
    _liveChannel = supaClient.channel('fileflow-live');
    ['tasks', 'files_out', 'staff', 'join_requests', 'folders', 'documents'].forEach(table => {
        _liveChannel.on('postgres_changes', { event: '*', schema: 'public', table }, onChange);
    });
    _liveChannel.subscribe();
}

// ============================================================
//  IMAGE COMPRESSION
// ============================================================
function compressImg(dataUrl, maxW=900, q=0.65) {
    return new Promise(res => {
        if (!dataUrl || !dataUrl.startsWith('data:image')) { res(dataUrl); return; }
        const img = new Image();
        img.onload = () => {
            let w=img.width, h=img.height;
            if (w>maxW) { h=Math.round(h*maxW/w); w=maxW; }
            const c=document.createElement('canvas'); c.width=w; c.height=h;
            c.getContext('2d').drawImage(img,0,0,w,h);
            res(c.toDataURL('image/jpeg',q));
        };
        img.onerror = ()=>res(dataUrl);
        img.src = dataUrl;
    });
}
// Create a signed URL for a stored image.
async function getSignedImageUrl(path) {
    if (!path || !supaClient) return null;
    let cleanPath = path;
    if (path.startsWith('http')) {
        const parts = path.split('fileflow_images/');
        if (parts.length > 1) {
            cleanPath = decodeURIComponent(parts.slice(1).join('fileflow_images/').split('?')[0]);
        } else {
            console.error('Could not extract path from full URL:', path);
            return null;
        }
    }
    
    let cacheMap = {};
    try { cacheMap = JSON.parse(localStorage.getItem('image_url_cache') || '{}'); } catch(e){}
    const now = Date.now();
    Object.keys(cacheMap).forEach(k => { if (!cacheMap[k] || cacheMap[k].expiry <= now) delete cacheMap[k]; });
    
    if (cacheMap[cleanPath] && cacheMap[cleanPath].expiry > now) {
        return cacheMap[cleanPath].url;
    }
    
    try {
        // Short-lived links: a suspended user's cached links stop working within a day.
        const { data, error } = await supaClient.storage.from('fileflow_images').createSignedUrl(cleanPath, 86400);
        if (error) { console.error('Error creating signed URL:', error); return null; }
        
        // Cache slightly shorter than the link lifetime so we never serve an expired URL.
        cacheMap[cleanPath] = { url: data.signedUrl, expiry: now + (23 * 3600 * 1000) };
        try { localStorage.setItem('image_url_cache', JSON.stringify(cacheMap)); } catch(e) {}
        
        return data.signedUrl;
    } catch (e) { console.error('Exception creating signed URL:', e); return null; }
}

// Read a file as a base64 data URL.
function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Could not read file.'));
        reader.readAsDataURL(file);
    });
}

// Compress and upload an asset photo to company storage.
async function fileToCompressed(file) {
    if (!file || !supaClient) return null;
    if (!file.type.startsWith('image/')) throw new Error('Only image files are allowed.');
    if (file.size > 10 * 1024 * 1024) throw new Error('Image size must be 10 MB or less.');
    // Images are stored under the company folder so every staff member can
    // view each other's files; falls back to the user folder on legacy setups.
    const folder = window.companyCode || window.currentUserId;
    try {
        const dataUrl = await readFileAsDataURL(file);
        const compressed = await compressImg(dataUrl, 900, 0.65);
        const blob = await (await fetch(compressed)).blob();
        const fileName = `${folder}/${crypto.randomUUID()}.jpg`;
        const { error } = await supaClient.storage.from('fileflow_images').upload(fileName, blob, { contentType: 'image/jpeg' });
        if (error) throw error;
        return fileName;
    } catch(e) {
        console.error(e);
        throw e;
    }
}
// For My Documents - NO compression, preserve original quality
async function fileToOriginal(file) {
    if (!file || !supaClient) return null;
    if (!file.type.startsWith('image/')) throw new Error('Only image files are allowed.');
    if (file.size > 25 * 1024 * 1024) throw new Error('Document image size must be 25 MB or less.');
    const folder = window.companyCode || window.currentUserId;
    try {
        const fileExt = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const fileName = `${folder}/doc_${crypto.randomUUID()}.${fileExt}`;
        const { error } = await supaClient.storage.from('fileflow_images').upload(fileName, file);
        if (error) throw error;
        return fileName;
    } catch(e) {
        console.error(e);
        throw e;
    }
}

// Apply the saved filters to the current list.
function applyFilters() {
    const input = document.getElementById('detailSearchInput');
    const query = input ? input.value.toLowerCase() : '';
    const container = document.getElementById('detailListContainer');
    if (!container) return;
    
    const items = Array.from(container.querySelectorAll('.file-item'));
    if (!items.length) return;
    
    items.sort((a, b) => {
        let valA, valB;
        if (currentSort.startsWith('date')) {
            valA = parseInt(a.getAttribute('data-date')) || 0;
            valB = parseInt(b.getAttribute('data-date')) || 0;
            return currentSort === 'date_asc' ? valA - valB : valB - valA;
        } else {
            valA = a.getAttribute('data-name') || '';
            valB = b.getAttribute('data-name') || '';
            return currentSort === 'name_asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
    });
    
    items.forEach((item, index) => {
        item.style.order = index;
        
        const textMatch = item.innerText.toLowerCase().includes(query);
        const status = item.getAttribute('data-status') || '';
        const statusMatch = currentStatusFilter === 'all' || status === currentStatusFilter;
        const ownerMatch = currentOwnerFilter !== 'mine' || item.getAttribute('data-mine') === '1';
        
        if (textMatch && statusMatch && ownerMatch) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
}

// Convert local mobile number (e.g. 03006722222) to full international format (+923006722222)
function formatAndValidateMobile(input) {
    if (!input) return { valid: false, formatted: '' };
    let clean = input.trim().replace(/[^\d+]/g, ''); // keep digits and +
    if (!clean) return { valid: false, formatted: '' };
    
    const countryObj = getDefaultCountryObj();
    const dialCode = countryObj.code; // e.g. +92
    
    if (clean.startsWith('+')) {
        // Already international format
        if (clean.length >= 8 && clean.length <= 16) {
            return { valid: true, formatted: clean };
        }
        return { valid: false, formatted: clean };
    }
    
    // If starts with 0 (e.g. 03006722222), strip leading 0
    if (clean.startsWith('0')) {
        clean = clean.substring(1);
    }
    
    // Attach country dial code
    const fullNumber = dialCode + clean;
    
    // Simple length check: digits must be at least 7
    if (clean.length >= 6 && clean.length <= 14) {
        return { valid: true, formatted: fullNumber };
    }
    
    return { valid: false, formatted: fullNumber };
}

// Copy a value to the clipboard.
function copyCompanyCode(code) {
    if (!code) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => showToast('Company code copied to clipboard!', 'success')).catch(() => fallbackCopy(code));
    } else {
        fallbackCopy(code);
    }
}
// Fallback clipboard copy using execCommand.
function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Company code copied!', 'success');
}

// Select a workflow type and render its fields.
function selectWorkflowType(typeId) {
    const w = WORKFLOW_TYPES.find(x => x.id === typeId) || WORKFLOW_TYPES[0];
    const inp = document.getElementById('taskWorkflowType');
    if (inp) inp.value = w.id;
    
    // Update visual trigger card
    const ic = document.getElementById('workflowIconBadge');
    const tt = document.getElementById('workflowTitleDisplay');
    const st = document.getElementById('workflowSubDisplay');
    if (ic) {
        ic.textContent = w.icon;
        ic.style.background = w.color + '18';
        ic.style.color = w.color;
    }
    if (tt) tt.textContent = w.title;
    if (st) st.textContent = w.subtitle;
    
    closePopup();
    toggleWorkflowFormFields();
}

// Filter the assignee list by search query.
function filterAssigneePickerList() {
    const q = (document.getElementById('staffFilterInput')?.value || '').toLowerCase();
    document.querySelectorAll('.staff-picker-card').forEach(card => {
        const nm = card.getAttribute('data-name') || '';
        const rl = card.getAttribute('data-role') || '';
        card.style.display = (nm.includes(q) || rl.includes(q)) ? 'flex' : 'none';
    });
}

// Select a staff member as assignee.
function selectAssigneeMember(id, name, role, targetInputId) {
    const inp = document.getElementById(targetInputId);
    if (inp) inp.value = id;
    
    if (targetInputId === 'assignedTo') {
        const nmEl = document.getElementById('assigneeNameDisplay');
        const rlEl = document.getElementById('assigneeRoleDisplay');
        const avEl = document.getElementById('assigneeAvatarBadge');
        if (nmEl) nmEl.textContent = name;
        if (rlEl) rlEl.textContent = role.charAt(0).toUpperCase() + role.slice(1);
        if (avEl) {
            avEl.textContent = (name || 'S').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        }
    } else if (targetInputId === 'stepAssigneeSelect') {
        const stepNmEl = document.getElementById('stepAssigneeNameDisplay');
        const stepAvEl = document.getElementById('stepAvatarBadge');
        if (stepNmEl) stepNmEl.textContent = `${name} (${role})`;
        if (stepAvEl) {
            stepAvEl.textContent = (name || 'S').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        }
    } else if (targetInputId === 'takenBySelect') {
        const tbNmEl = document.getElementById('takenByNameDisplay');
        const tbRlEl = document.getElementById('takenByRoleDisplay');
        const tbAvEl = document.getElementById('takenByAvatarBadge');
        if (tbNmEl) tbNmEl.textContent = name;
        if (tbRlEl) tbRlEl.textContent = role.charAt(0).toUpperCase() + role.slice(1);
        if (tbAvEl) {
            tbAvEl.textContent = (name || 'S').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        }
    }
    
    closePopup();
}

// Toggle workflow fields based on the selected workflow type.
function toggleWorkflowFormFields() {
    const type = document.getElementById('taskWorkflowType')?.value || 'simple';
    const aw = document.getElementById('assigneeWrapper');
    const al = document.getElementById('assigneeLabel');
    const gaws = document.getElementById('groupAssigneesWrapper');
    const sfs = document.getElementById('stepsFormSection');
    const saw = document.getElementById('stepAssigneeWrapper');
    
    if (aw) aw.style.display = 'none';
    if (gaws) gaws.style.display = 'none';
    if (sfs) sfs.style.display = 'none';
    if (saw) saw.style.display = 'none';
    
    if (type === 'simple') {
        if (aw) aw.style.display = 'block';
        if (al) al.innerHTML = 'Assigned To <span class="required">*</span>';
    } else if (type === 'sequential') {
        if (sfs) sfs.style.display = 'block';
        if (saw) saw.style.display = 'flex';
        const st = document.getElementById('stepsSectionTitle');
        if (st) st.textContent = 'Add Task Steps (Sequential Handover Pipeline)';
    } else if (type === 'parallel') {
        if (sfs) sfs.style.display = 'block';
        if (saw) saw.style.display = 'flex';
        const st = document.getElementById('stepsSectionTitle');
        if (st) st.textContent = 'Add Sub-tasks (Parallel Collaboration)';
    } else if (type === 'group') {
        if (gaws) gaws.style.display = 'block';
        const container = document.getElementById('groupWorkersCheckboxes');
        let staff = [];
        try { staff = JSON.parse(cacheGet('staff') || '[]'); } catch(e) {}
        let checkHtml = '';
        if (staff.length === 0) {
            checkHtml = '<p style="color:var(--text-secondary); font-size:13px; padding:10px; text-align:center;">No staff members found.</p>';
        } else {
            staff.forEach(s => {
                const initials = (s.name || 'S').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
                const isSuspended = s.status === 'suspended';
                if (!isSuspended) {
                    checkHtml += `
                        <label style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:10px; cursor:pointer; transition:background 0.15s;">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <div style="width:32px; height:32px; border-radius:50%; background:var(--accent); color:white; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">
                                    ${initials}
                                </div>
                                <div>
                                    <div style="font-weight:700; font-size:13px; color:var(--text-primary);">${esc(s.name)}</div>
                                    <div style="font-size:11px; color:var(--text-secondary); text-transform:capitalize;">${esc(s.role)}</div>
                                </div>
                            </div>
                            <input type="checkbox" name="groupWorker" value="${s.id}" style="width:18px; height:18px; accent-color:var(--accent); cursor:pointer;">
                        </label>
                    `;
                }
            });
        }
        if (container) container.innerHTML = checkHtml;
    }
    
    window._tempSteps = [];
    renderTempSteps();
}

// Add a workflow step to the temporary step list.
function addTempStep() {
    const type = document.getElementById('taskWorkflowType')?.value || 'simple';
    const input = document.getElementById('newStepInput');
    const val = (input?.value || '').trim();
    if (!val) { showToast('Step title is required.', 'error'); return; }
    
    let assignedTo = '';
    let name = '';
    let mobile = '';
    
    if (type === 'parallel' || type === 'sequential') {
        const staffId = document.getElementById('stepAssigneeSelect')?.value;
        let staff = [];
        try { staff = JSON.parse(cacheGet('staff') || '[]'); } catch(e) {}
        const member = staff.find(s => String(s.id) === String(staffId));
        if (!member) {
            showToast('Please select a staff member for this step!', 'error');
            return;
        }
        assignedTo = member.role;
        name = member.name;
        mobile = member.mobile;
    }
    
    let stepObj = {
        stepId: Date.now() + '-' + Math.floor(Math.random()*1000),
        stepTitle: val,
        staffId: type === 'parallel' || type === 'sequential' ? Number(document.getElementById('stepAssigneeSelect')?.value) || null : null,
        assignedTo: assignedTo,
        name: name,
        mobile: mobile,
        status: 'pending',
        note: '',
        updatedBy: '',
        updatedAt: ''
    };
    
    if (!window._tempSteps) window._tempSteps = [];
    window._tempSteps.push(stepObj);
    
    input.value = '';
    const sas = document.getElementById('stepAssigneeSelect');
    if (sas) sas.value = '';
    const stepNm = document.getElementById('stepAssigneeNameDisplay');
    if (stepNm) stepNm.textContent = 'Select Staff Member...';
    
    renderTempSteps();
}

// Remove a workflow step from the temporary step list.
function removeTempStep(stepId) {
    window._tempSteps = window._tempSteps.filter(s => s.stepId !== stepId);
    renderTempSteps();
}

// Re-render the temporary workflow steps.
function renderTempSteps() {
    const container = document.getElementById('tempStepsList');
    if (!container) return;
    const type = document.getElementById('taskWorkflowType')?.value || 'simple';
    
    container.innerHTML = (window._tempSteps || []).map((s, idx) => {
        let assigneeInfo = '';
        if ((type === 'parallel' || type === 'sequential') && s.name) {
            assigneeInfo = ` <span style="font-size:11px; background:rgba(37,99,235,0.1); color:var(--accent); padding:2px 8px; border-radius:6px; font-weight:700; margin-left:6px;">→ ${esc(s.name)}</span>`;
        }
        return `
            <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); padding:10px 12px; border-radius:10px; border:1px solid var(--border-color); font-size:13px;">
                <span style="font-weight:600; color:var(--text-primary);">${idx + 1}. ${esc(s.stepTitle)}${assigneeInfo}</span>
                <button type="button" onclick="removeTempStep('${s.stepId}')" style="background:none; border:none; color:#dc2626; cursor:pointer; font-weight:bold; font-size:14px; padding:2px 6px;">✕</button>
            </div>
        `;
    }).join('');
}

// Step the duration selector up or down.
function chDur(d){
    const n=durIdx+d;if(n>=0&&n<DURATIONS.length){durIdx=n;const el=document.getElementById('durVal');if(el)el.textContent=DURATIONS[durIdx];}

// Return the duration in minutes for a preset.
function durMins(d){return({'1 Hour':60,'2 Hours':120,'3 Hours':180,'1 Day':1440,'2 Days':2880,'3 Days':4320})[d]||60;}
// Compute the expiry timestamp for the selected duration.
function getDurExpiry(){
    // Returns expiresAt ISO string based on current duration selection
    if(DURATIONS[durIdx]==='Enter Date'){
        const dateEl=document.getElementById('customDurDate');
        if(!dateEl||!dateEl.value){showToast('Please select a date!', 'error');return null;}
        // Set time to end of selected day (parse as local date; new Date('YYYY-MM-DD') is UTC)
        const [y,m,dd]=dateEl.value.split('-').map(Number);
        const d=new Date(y,m-1,dd,23,59,59,999);
        if(isNaN(d)){showToast('Please select a valid date!', 'error');return null;}
        const todayEnd=new Date(new Date().toDateString());todayEnd.setHours(23,59,59,999);
        if(d.getTime()<todayEnd.getTime()){showToast('Entered date is in the past. Please choose today or a future date.', 'error');return null;}
        return d.toISOString();
    }
    return new Date(Date.now()+durMins(DURATIONS[durIdx])*60000).toISOString();
}

// Save a new task to the pending tasks list.
async function saveTask(){
    const title=gv('taskTitle'),td=gv('taskDetails');
    if(!title||!td){showToast('Please fill all required fields!', 'error');return;}
    
    const wType = document.getElementById('taskWorkflowType').value;
    let at = '', nm = '', mb = '';
    let assigneeIds = [];
    let hasSteps = false;
    let steps = [];
    
    let staff = [];
    try { staff = JSON.parse(cacheGet('staff') || '[]'); } catch(e) {}
    
    if (wType === 'simple') {
        const staffId = document.getElementById('assignedTo').value;
        if (!staffId) { showToast('Please select a staff member for this task!', 'error'); return; }
        const member = staff.find(s => String(s.id) === String(staffId));
        if (!member) { showToast('Selected staff member not found.', 'error'); return; }
        at = member.role;
        nm = member.name;
        mb = member.mobile;
        assigneeIds = [member.id];
    } else if (wType === 'sequential') {
        // The single "Assigned To" field is hidden for this workflow; the
        // first step's assignee is the initial owner of the task.
        hasSteps = true;
        steps = window._tempSteps || [];
        if (steps.length === 0) { showToast('Please add at least one step for sequential handover.', 'error'); return; }
        at = steps[0].assignedTo;
        nm = steps[0].name;
        mb = steps[0].mobile;
        assigneeIds = [steps[0].staffId].filter(Boolean);
    } else if (wType === 'parallel') {
        hasSteps = true;
        steps = window._tempSteps || [];
        if (steps.length === 0) { showToast('Please add at least one sub-task step.', 'error'); return; }
        at = 'parallel';
        nm = 'Parallel Team';
        mb = 'N/A';
        assigneeIds = [...new Set(steps.map(st => st.staffId).filter(Boolean))];
    } else if (wType === 'group') {
        const groupCheckboxes = document.querySelectorAll('input[name="groupWorker"]:checked');
        if (groupCheckboxes.length === 0) { showToast('Please select at least one worker for this group task.', 'error'); return; }
        const selectedIds = Array.from(groupCheckboxes).map(cb => cb.value);
        const members = staff.filter(s => selectedIds.includes(String(s.id)));
        if (!members.length) { showToast('Selected workers not found.', 'error'); return; }
        at = members.map(m => m.role).join(',');
        nm = 'Group Task: ' + members.map(m => m.name).join(', ');
        mb = 'N/A';
        assigneeIds = members.map(m => m.id);
    }
    
    const expAt=getDurExpiry();if(!expAt)return;
    showLoading('Saving task...');
    const creator = window.userEmail || 'admin';
    const entry={
        title:title,
        description:td,
        assigned_to:at,
        assignee_staff_ids:assigneeIds,
        name:nm,
        mobile:mb,
        assigned_by:creator,
        created_by:window.currentUserId || null,
        workflow_type:wType,
        has_steps:hasSteps,
        steps:steps,
        overall_progress:0,
        status:'not_started',
        history:[{action:'Task Created (' + wType.toUpperCase() + ')', by:creator, at:new Date().toISOString(), note:'Initial creation'}],
        duration:DURATIONS[durIdx],
        createdAt:new Date().toISOString(),
        expiresAt:expAt,
        due_date:expAt,
        mode:'assignedTask',
        taskType: 'General',
        taskDetails: td
    };
    try{
        const saved = await dbInsertRow('tasks', toDbRow('tasks', entry), 'Saving task');
        placeTaskInCache(fromDbRow('tasks', saved));
        cancelForm();
        loadCounts();
        showToast('Task saved successfully!', 'success');
    }
    catch(e){showToast('Save failed: ' + e.message, 'error');}
    hideLoading();
}
// Save a new file/checkout movement entry.
async function saveFileMov(isPic){
    const title=gv('title'),nature=document.getElementById('nature').value;
    if(!title||!nature){showToast('Please fill all required fields!', 'error');return;}
    if(isPic&&!window._tempImageFile){showToast('Please capture an asset photo!', 'error');return;}
    
    const bSel = document.getElementById('borrowerTypeSelect');
    const bType = bSel ? bSel.value : 'staff';
    let takenBy = 'visitor', name = '', mobile = '';
    
    if (bType === 'staff') {
        const staffId = document.getElementById('takenBySelect').value;
        if (!staffId) { showToast('Please select a staff member!', 'error'); return; }
        let staff = [];
        try { staff = JSON.parse(cacheGet('staff') || '[]'); } catch(e) {}
        const member = staff.find(s => String(s.id) === String(staffId));
        if (!member) { showToast('Selected staff member not found.', 'error'); return; }
        takenBy = member.role;
        name = member.name;
        mobile = member.mobile;
    } else {
        name = gv('externalName');
        const rawInput = gv('externalMobile');
        if (!name) { showToast('Please enter Borrower Name!', 'error'); return; }
        if (!rawInput) { showToast('Please enter Mobile number!', 'error'); return; }
        const mobCheck = formatAndValidateMobile(rawInput);
        if (!mobCheck.valid) { showToast('Please enter a valid mobile number (e.g. 03001234567)!', 'error'); return; }
        mobile = mobCheck.formatted;
        takenBy = 'visitor';
    }
    
    // Validate the due date before uploading anything.
    const expAt=getDurExpiry();
    if(!expAt) return;
    
    let image=null;
    if(isPic){
        showLoading('Uploading image...');
        try { image = await fileToCompressed(window._tempImageFile); }
        catch (err) { hideLoading(); showToast(err.message || 'Image upload failed.', 'error'); return; }
    }
    
    showLoading('Saving checkout entry...');
    try {
        const entry={title,nature,dateField:expAt,takenBy,name,mobile,
            status:'out',
            created_by:window.currentUserId || null,
            duration:DURATIONS[durIdx],createdAt:new Date().toISOString(),
            expiresAt:expAt,image,mode:'fileMovement'};
        const saved = await dbInsertRow('files_out', toDbRow('files_out', entry), 'Saving checkout');
        const arr=JSON.parse(cacheGet('filesOut')||'[]');
        arr.push(fromDbRow('files_out', saved));
        _cache['filesOut']=JSON.stringify(arr);
        cancelForm();
        loadCounts();
        showToast('Checkout entry saved successfully!', 'success');
    } catch(e) {
        if (image) deleteStorageImage(image);
        showToast('Save failed: ' + e.message, 'error');
    } finally {
        hideLoading();
    }
}

// ============================================================
//  UTILS
// ============================================================
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
// Escape a string for a single-quoted JS literal inside a double-quoted HTML attribute.
// Quotes, &, < and > are hex-escaped so the value can never break out of the attribute.
function jsEsc(s){return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,'\\x27').replace(/"/g,'\\x22').replace(/&/g,'\\x26').replace(/</g,'\\x3C').replace(/>/g,'\\x3E').replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');}
// Format a date string for display.
function fmtDate(d){if(!d)return'N/A';const dt=new Date(d);if(isNaN(dt))return d;return`${String(dt.getDate()).padStart(2,'0')}-${String(dt.getMonth()+1).padStart(2,'0')}-${dt.getFullYear()}`;}
// Compute the return status label.
function retStatus(r,e){
    const ret=new Date(r),exp=new Date(e);
    if(ret<=exp)return '<span style="color:#16a34a;font-weight:600;">✓ On Time</span>';
    const diff=ret-exp;
    const dy=Math.floor(diff/86400000),hr=Math.floor((diff%86400000)/3600000),mn=Math.floor((diff%3600000)/60000);
    let late='';
    if(dy>0)late=dy+'d '+(hr>0?hr+'h ':'')+(mn>0?mn+'m':'');
    else if(hr>0)late=hr+'h '+(mn>0?mn+'m':'');
    else late=mn+'m';
    return '<span style="color:#dc2626;font-weight:600;">⚠ '+late.trim()+' Late</span>';
}
// Return a human-readable countdown for an expiry.
function timeLeft(ex){
    const d=new Date(ex)-new Date();
    if(d<=0)return'<span style="color:#dc2626;font-weight:700;">OVERDUE</span>';
    const dy=Math.floor(d/86400000);
    const hr=Math.floor((d%86400000)/3600000);
    const mn=Math.floor((d%3600000)/60000);
    // 24 ghante se zyada bacha: days + hours dikhao
    if(dy>=1){return`<span style="color:#d97706;font-weight:700;">${dy}d ${hr}h remaining</span>`;}
    // Last 24 hours: hours + minutes (no seconds)
    if(hr>0)return`<span style="color:#d97706;font-weight:700;">${hr}h ${mn}m remaining</span>`;
    if(mn>0)return`<span style="color:#dc2626;font-weight:700;">${mn}m remaining</span>`;
    return'<span style="color:#dc2626;font-weight:700;">Less than a minute</span>';
}

// Reclassify overdue entries in the background.
// Overdue is derived from the due date, so this only moves items between
// cached lists; it never rewrites database rows (works for every role).
function checkOverdue(sk,ok){
    try{
        const items=JSON.parse(cacheGet(sk)||'[]'),overdues=JSON.parse(cacheGet(ok)||'[]'),now=new Date(),still=[];
        let moved=0;
        for (const i of items) {
            if (i.expiresAt && now > new Date(i.expiresAt)) {
                overdues.push(sk === 'filesOut' ? { ...i, status: 'overdue' } : i);
                moved++;
            } else still.push(i);
        }
        if(moved){_cache[sk]=JSON.stringify(still);_cache[ok]=JSON.stringify(overdues);loadCounts();}
    }catch(e){console.error('checkOverdue error:',e);}
}

</div><div id="detailListContainer" style="display:flex; flex-direction:column; padding-bottom:80px;">`;
    if(!files.length) {
        html+=getEmptyStateHTML('No entries found', 'There are currently no items in this list.', 'task');
    } else {
        startTopLoader(); document.body.classList.add('skeleton-mode');
        let renderedItems = files.map(f => renderFileItem(f, type));
        html += renderedItems.join('');

// Check whether a duration is day/date based.
function isDayOrDateDur(dur){
    // Minutes/Hours = short duration; Days or custom date = long duration (show taken/returned dates)
    return !['5 Mins','15 Mins','30 Mins','1 Hour','2 Hours','3 Hours'].includes(dur);
}
// Render a single file/task card in a list.
function renderFileItem(file,type){
    const isRet=['returnedFiles','completedTasks'].includes(type);
    const isOvr=['overdueFiles','overdueTasks'].includes(type);
    const fid=file.id,en=jsEsc(file.name||''),et=jsEsc(file.title||file.taskType||'Entry');
    const useDateView=isDayOrDateDur(file.duration);

    // BANNER: picture or title/taskType
    let banner='';
    if(file.image){
         banner=`<div class="file-banner picture-banner" onclick="showImgPrev(this)" data-src="${esc(file.image||'')}">🖼 View Picture</div>`;
    }
    else if(file.mode==='assignedTask')banner=`<div class="file-banner" style="background:linear-gradient(135deg,#4f46e5 0%,#3730a3 100%);">${esc(file.title || file.taskType || 'Assigned Task')}</div>`;
    else if(file.title&&file.title!=='Image Captured')banner=`<div class="file-banner">${esc(file.title)}</div>`;
    else if(file.taskType)banner=`<div class="file-banner">${esc(file.taskType)}</div>`;

    // FILE INFO BLOCK: hearing/decision date + nature centered, then divider line
    let fileInfoLine='';
    if(file.mode==='fileMovement'&&file.dateField){
        const isFuture=new Date(file.dateField)>=new Date(new Date().toDateString());
        const label=isFuture?LABELS.dueDate:'Completion Date';
        const natureLabels={file:'📁 File',material:'📦 Material',equipment:'💻 Equipment',keys:'🔑 Keys',other:'📄 Other'};
        const naturePart=file.nature&&file.nature!=='N/A'?`<span style="margin-left:12px;color:var(--text-secondary);font-weight:500;">| ${esc(natureLabels[file.nature]||file.nature)}</span>`:'';
        fileInfoLine=`<div style="text-align:center;padding:6px 12px 8px;border-bottom:1px solid var(--border-color);margin-bottom:6px;"><span style="font-weight:600;font-size:14px;color:var(--text-primary);">${label}: ${fmtDate(file.dateField)}</span>${naturePart}</div>`;
    }

    // TAKEN LINE: "Taken Date: XX for 5 Mins" OR "Taken Date: XX / Returned Date: XX"
    let info='';
    if(file.mode==='assignedTask'){
        const rs=isRet?retStatus(file.returnedAt||file.completedAt,file.expiresAt):'';
        const takenLine=useDateView
            ?`<p><strong>Taken Date:</strong> ${fmtDate(file.createdAt)}</p><p><strong>Due Complete Date:</strong> ${fmtDate(file.expiresAt)}</p>`
            :`<p><strong>Taken Date:</strong> ${fmtDate(file.createdAt)} <span style="color:var(--text-secondary);font-weight:normal;">for ${esc(file.duration||'')}</span></p>`;
        
        let progressInfo = '';
        if (file.has_steps) {
            const doneCount = (file.steps || []).filter(s => s.status === 'done').length;
            const totSteps = (file.steps || []).length;
            progressInfo = `<p><strong>Progress:</strong> <span style="background:var(--accent-light);color:var(--accent);padding:2px 6px;border-radius:6px;font-weight:bold;font-size:11px;">${file.overall_progress || 0}% (${doneCount}/${totSteps} steps)</span></p>`;
        }
        
        const statusMap = {
            'not_started': '<span style="background:#e2e8f0;color:#475569;padding:2px 6px;border-radius:6px;font-weight:bold;font-size:11px;text-transform:uppercase;">Not Started</span>',
            'in_progress': '<span style="background:#fef3c7;color:#d97706;padding:2px 6px;border-radius:6px;font-weight:bold;font-size:11px;text-transform:uppercase;">In Progress</span>',
            'completed': '<span style="background:#d1fae5;color:#059669;padding:2px 6px;border-radius:6px;font-weight:bold;font-size:11px;text-transform:uppercase;">Completed</span>'
        };
        const statusBadge = statusMap[file.status || 'not_started'] || statusMap['not_started'];

        info=`<p><strong>Description:</strong> ${esc(file.description || file.taskDetails || '')}</p>
<p><strong>Assigned To:</strong> ${esc(file.name||'')}${file.assignedTo && file.assignedTo !== 'parallel' ? ` <span style="text-transform:capitalize;">(${esc(String(file.assignedTo).replace(/,/g, ', '))})</span>` : ''}</p>
<p><strong>Assigned By:</strong> ${esc(file.assigned_by || 'Admin')}</p>
<p><strong>Status:</strong> ${statusBadge}</p>
${progressInfo}
${takenLine}
${!isRet?`<p id="timer-${fid}"><strong>Time Remaining:</strong> ${timeLeft(file.expiresAt)}</p>`:''}
${isRet?`<p><strong>Completed:</strong> ${fmtDate(file.returnedAt||file.completedAt)} ${rs}</p>`:''}`;
    }else{
        // fileMovement (Checkout Registry)
        const rs=isRet?retStatus(file.returnedAt,file.expiresAt):'';
        const takenLine=useDateView
            ?`<p><strong>Taken Date:</strong> ${fmtDate(file.createdAt)}</p><p><strong>Due Return Date:</strong> ${fmtDate(file.expiresAt)}</p>`
            :`<p><strong>Taken Date:</strong> ${fmtDate(file.createdAt)} <span style="color:var(--text-secondary);font-weight:normal;">for ${esc(file.duration||'')}</span></p>`;
        const emojiMap = {
            file: '📁 File / Document',
            material: '📦 Material / Inventory',
            equipment: '💻 Equipment / Device',
            keys: '🔑 Key / Access Card',
            other: '📄 Other'
        };
        const emojiLabel = emojiMap[file.nature] || '📁 File';
        info=`<p><strong>Taken By:</strong> ${esc(file.name||'')}</p><p><strong>Asset Type:</strong> ${emojiLabel}</p>${takenLine}${!isRet?`<p id="timer-${fid}"><strong>Time Remaining:</strong> ${timeLeft(file.expiresAt)}</p>`:''}${isRet?`<p><strong>Returned:</strong> ${fmtDate(file.returnedAt)} ${rs}</p>`:''}`;
    }

    const warn=(!isRet&&isOvr)?`<div class="overdue-warning">⚠ Take Action against ${esc(file.name||'')}</div>`:'';
    const isTask = file.mode === 'assignedTask';
    const canDel = window.userRole === 'Admin' || (window.userRole === 'Staff' && String(file.created_by) === String(window.currentUserId));
    const actionButtons = isTask 
         ? `<button class="action-btn call-btn" onclick="openCommunicationMenu('${jsEsc(file.mobile||'')}', '${jsEsc(file.name||file.assigned_to||'')}', '${jsEsc(file.title||'')}', 'task')">💬 Contact</button>
           <button class="action-btn" style="background:linear-gradient(135deg,#4f46e5,#3730a3);color:white;" onclick="openTaskManager(${fid},'${type}')">⚙ Manage</button>
           ${isRet && canDel ? `<button class="action-btn delete-btn" onclick="confirmDelete(${fid},'${type}','${et}')">🗑 Delete</button>` : ''}`
        : `<button class="action-btn call-btn" onclick="openCommunicationMenu('${jsEsc(file.mobile||'')}', '${jsEsc(file.name||file.taken_by||'')}', '${jsEsc(file.title||'')}', 'checkout')">💬 Contact</button>
           ${!isRet?`<button class="action-btn receive-btn" onclick="confirmReceive(${fid},'${type}','${et}','${en}')">✓ Receive</button>`:''}
           ${isRet && canDel?`<button class="action-btn delete-btn" onclick="confirmDelete(${fid},'${type}','${et}')">🗑 Delete</button>`:''}`;

    const sortDate = new Date(file.createdAt).getTime();
    const sortName = (file.name || file.title || file.taskType || '').toLowerCase().replace(/"/g, '&quot;');
    const sortStatus = isOvr ? 'overdue' : (file.status || 'unknown');
    
     return `<div class="file-item" data-date="${sortDate}" data-name="${esc(sortName)}" data-status="${esc(sortStatus)}" data-mine="${isTask && isMyTask(file) ? 1 : 0}">${banner}${fileInfoLine}<div class="file-content"><div class="file-info">${info}</div>${warn}<div class="file-actions">${actionButtons}</div></div></div>`;
}

function confirmReceive(id,type,title,name){const isTask=type.includes('Task');showConfirmPopup(`Confirm ${isTask?'Completion':'Return'}`,`Has "${title}" been ${isTask?'completed':'returned'} by ${name}?`,()=>doReceive(id,type));}
// Mark a checkout entry as returned.
async function doReceive(id,type){
    const MAP={filesOut:{f:'filesOut',t:'returnedFiles'},overdueFiles:{f:'overdueFiles',t:'returnedFiles'},pendingTasks:{f:'pendingTasks',t:'completedTasks'},overdueTasks:{f:'overdueTasks',t:'completedTasks'}};
    const k=MAP[type];if(!k)return;
    if(window.userRole==='Viewer'){showToast('Viewers cannot modify records.', 'error');return;}
    const arr=JSON.parse(cacheGet(k.f)||'[]'),idx=arr.findIndex(f=>f.id===id);if(idx===-1)return;
    const file=arr[idx],now=new Date();
    
    showLoading(isTaskType(type) ? 'Completing task...' : 'Receiving item...');
    try {
        arr.splice(idx,1);
        const table = isTaskType(type) ? 'tasks' : 'files_out';
        
        let completedSteps = file.steps;
        if (isTaskType(type) && Array.isArray(file.steps)) {
            completedSteps = file.steps.map(s => ({ ...s, status: 'done', updatedAt: now.toISOString(), updatedBy: window.userEmail || 'admin' }));
        }
        
        const update = isTaskType(type)
            ? { status: 'completed', completed_at: now.toISOString(), overall_progress: 100, steps: completedSteps }
            : { status: 'returned', returned_at: now.toISOString() };
            
        dbError(await supaClient.from(table).update(update).eq('id', id), `Completing ${table} record`);
        _cache[k.f] = JSON.stringify(arr);
        
        const retObj = {
            ...file,
            status: isTaskType(type) ? 'completed' : 'returned',
            overall_progress: isTaskType(type) ? 100 : (file.overall_progress || 0),
            steps: completedSteps,
            returnedAt: now.toISOString(),
            completedAt: now.toISOString(),
            returnedLate: now > new Date(file.expiresAt)
        };
        const ret=JSON.parse(cacheGet(k.t)||'[]');
        ret.push(retObj);
        _cache[k.t]=JSON.stringify(ret);
        
        showToast(isTaskType(type) ? 'Task marked as completed!' : 'Item marked as returned!', 'success');
        _detailInternal(type);
        loadCounts();
    } catch(e) {
        showToast('Failed to complete action: ' + e.message, 'error');
    } finally {
        hideLoading();
    }
}

// Return the mode string for a task type.
function isTaskType(type) { return type === 'pendingTasks' || type === 'overdueTasks' || type === 'completedTasks'; }

// Rebuild the in-memory folders cache.
async function refreshFoldersCache() {
    const rawFolders = dbError(await supaClient.from('folders').select('*').is('deleted_at', null).order('id', {ascending: false}).limit(1000), 'Loading folders');
    const rawDocuments = dbError(await supaClient.from('documents').select('*').is('deleted_at', null).order('id', {ascending: false}).limit(2000), 'Loading documents');
    if (rawFolders && rawDocuments) {
        const engFolders = rawFolders.filter(f => f.category === 'englishFile').map(f => ({
            ...fromDbRow('folders', f), documents: rawDocuments.filter(d => d.folder_id === f.id).map(d => fromDbRow('documents', d))
        }));
        _cache['englishFile_folders'] = JSON.stringify(engFolders);
    }
}

// Confirm deleting a file/task entry.
function confirmDelete(id,type,title){showConfirmPopup('Delete Entry',`Delete "${title}"?`,()=>doDelete(id,type));}
// Perform the hard delete of an entry.
async function doDelete(id,type){
    if(!['returnedFiles','completedTasks'].includes(type))return;
    const table = type === 'returnedFiles' ? 'files_out' : 'tasks';
    
    // Soft Delete: Get item first
    const arr=JSON.parse(cacheGet(type)||'[]');
    const item = arr.find(x => x.id === id);
    if(!item) return;
    if(!canManageEntry(item.created_by)){showToast('You can only delete entries you created.', 'error');return;}
    showLoading('Moving to Recycle Bin...');
    try {
        // Soft delete: the row stays in the database until the bin is emptied.
        await dbSoftDelete(table, id, `Deleting ${table} record`);
        _cache[type] = JSON.stringify(arr.filter(f=>f.id!==id));
        _detailInternal(type);loadCounts();
        showToast('Entry moved to Recycle Bin.', 'success');
    } catch(e) {
        showToast('Delete failed: ' + e.message, 'error');
    } finally {
        hideLoading();
    }
}

    const target = staffList.find(x => String(x.id) === String(id));
    if (target && target.user_id && target.user_id === window.currentUserId) { showToast('You cannot delete your own account.', 'error'); return; }

// Render the workflow steps in the task manager.
function renderEditingSteps(taskWorkflowType) {
    return (window._editingTaskSteps || []).map((s, idx) => {
        const isDone = s.status === 'done';
        let assigneeInfo = '';
        if ((taskWorkflowType === 'parallel' || taskWorkflowType === 'sequential') && s.name) {
            assigneeInfo = `<span style="font-size:11px; background:var(--accent-light); color:var(--accent); padding:2px 6px; border-radius:6px; font-weight:bold; margin-left:6px;">→ Assigned to: ${esc(s.name)}</span>`;
        }
        return `
            <div style="border:1px solid var(--border-color); border-radius:10px; padding:10px; background:var(--bg-card); font-size:13px; margin-top:6px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <span style="font-weight:600;">Step ${idx + 1}: ${esc(s.stepTitle)}${assigneeInfo}</span>
                    <select onchange="updateEditingStepStatus('${s.stepId}', this.value)" style="padding:4px 8px; border-radius:6px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-primary); font-size:12px;">
                        <option value="pending" ${s.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="in_progress" ${s.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                        <option value="done" ${isDone ? 'selected' : ''}>Done</option>
                    </select>
                </div>
                <div style="margin-bottom:4px;">
                    <input type="text" id="stepNote-${s.stepId}" value="${esc(s.note || '')}" placeholder="Add optional worker comment..." style="width:100%; padding:6px 10px; border-radius:6px; border:1px solid var(--border-color); font-size:12px; background:var(--input-bg); color:var(--text-primary);" onchange="updateEditingStepNote('${s.stepId}', this.value)">
                </div>
                ${s.updatedBy ? `<div style="font-size:10px; color:var(--text-secondary);">Updated by ${esc(s.updatedBy)} at ${new Date(s.updatedAt).toLocaleString()}</div>` : ''}
            </div>
        `;
    }).join('');
}

// Update a task step's status.
function updateEditingStepStatus(stepId, status) {
    const steps = window._editingTaskSteps || [];
    const idx = steps.findIndex(s => s.stepId === stepId);
    const step = steps[idx];
    // Sequential handover: a step can only start after every earlier step is done,
    // and a finished step cannot be reopened while a later step has started.
    if (step && window._editingWorkflowType === 'sequential') {
        const earlierOpen = steps.slice(0, idx).some(s => s.status !== 'done');
        const laterStarted = steps.slice(idx + 1).some(s => s.status !== 'pending');
        let msg = '';
        if (status !== 'pending' && earlierOpen) msg = 'Complete the previous steps first (sequential workflow).';
        else if (status !== 'done' && laterStarted) msg = 'A later step has already started. Reset it first.';
        if (msg) {
            showToast(msg, 'error');
            const box = document.getElementById('editingStepsContainer');
            if (box) box.innerHTML = renderEditingSteps('sequential');
            return;
        }
    }
    if (step) {
        step.status = status;
        step.updatedBy = window.userEmail || 'worker';
        step.updatedAt = new Date().toISOString();
        
        const doneCount = window._editingTaskSteps.filter(s => s.status === 'done').length;
        const tot = window._editingTaskSteps.length;
        const pct = tot > 0 ? Math.round((doneCount / tot) * 100) : 0;
        
        const pctEl = document.getElementById('editingOverallProgressPercent');
        const fillEl = document.getElementById('editingProgressBarFill');
        if (pctEl) pctEl.textContent = pct + '%';
        if (fillEl) fillEl.style.width = pct + '%';
    }
}

// Update a task step's note.
function updateEditingStepNote(stepId, note) {
    const step = (window._editingTaskSteps || []).find(s => s.stepId === stepId);
    if (step) {
        step.note = note;
        step.updatedBy = window.userEmail || 'worker';
        step.updatedAt = new Date().toISOString();
    }
}

// Locate a task across all lists by id.
function findTaskById(id) {
    for (const key of ['pendingTasks', 'overdueTasks', 'completedTasks']) {
        const list = JSON.parse(cacheGet(key) || '[]');
        const found = list.find(t => t.id === id);
        if (found) return { task: found, cacheKey: key, list: list };
    }
    return null;
}

    } catch(e) {

}

// Save all task manager edits.
async function saveTaskManagerChanges(taskId, currentType) {
    if (window.userRole === 'Viewer') { showToast('Viewers cannot modify tasks.', 'error'); return; }
    const res = findTaskById(taskId);
    if (!res) { showToast('Task not found', 'error'); return; }
    const { task } = res;
    if (!Array.isArray(task.history)) task.history = [];
    
    let statusChanged = false;
    let oldStatus = task.status;
    let newStatus = oldStatus;
    
    let oldActiveStep = null;
    let newActiveStep = null;
    let suggestForward = false;
    
    if (task.has_steps) {
        if (task.workflow_type === 'sequential') {
            oldActiveStep = (task.steps || []).find(s => s.status !== 'done');
        }
        
        task.steps = window._editingTaskSteps;
        const doneCount = task.steps.filter(s => s.status === 'done').length;
        const inProgCount = task.steps.filter(s => s.status === 'in_progress').length;
        const tot = task.steps.length;
        
        task.overall_progress = tot > 0 ? Math.round((doneCount / tot) * 100) : 0;
        
        if (doneCount === tot && tot > 0) {
            newStatus = 'completed';
        } else if (doneCount > 0 || inProgCount > 0) {
            newStatus = 'in_progress';
        } else {
            newStatus = 'not_started';
        }
        
        if (task.workflow_type === 'sequential') {
            newActiveStep = (task.steps || []).find(s => s.status !== 'done');
            if (oldActiveStep && newActiveStep && oldActiveStep.stepId !== newActiveStep.stepId) {
                if (newActiveStep.name && newActiveStep.assignedTo) {
                    suggestForward = true;
                }
            }
        }
    } else {
        const statEl = document.getElementById('taskManagerStatus');
        if (statEl) newStatus = statEl.value;
        task.overall_progress = newStatus === 'completed' ? 100 : (newStatus === 'in_progress' ? 50 : 0);
    }
    
    const worker = window.userEmail || 'worker';
    if (newStatus !== oldStatus) {
        statusChanged = true;
        task.status = newStatus;
        task.history.push({
            action: `Status changed to ${newStatus.replace('_', ' ')}`,
            by: worker,
            at: new Date().toISOString(),
            note: 'Task status updated'
        });
        if (newStatus === 'completed') {
            task.completedAt = new Date().toISOString();
            task.completed_at = task.completedAt;
        } else {
            task.completedAt = null;
            task.completed_at = null;
        }
    } else if (task.has_steps) {
        task.history.push({
            action: 'Steps checklist updated',
            by: worker,
            at: new Date().toISOString(),
            note: 'Updated sub-tasks checklist'
        });
    }
    
    if (suggestForward && newActiveStep) {
        showConfirmPopup(
            "Forward Task?",
            `The next step ("${newActiveStep.stepTitle}") is assigned to ${newActiveStep.name}. Would you like to forward this task to them?`,
            async () => {
                task.assigned_to = newActiveStep.assignedTo;
                task.name = newActiveStep.name;
                task.mobile = newActiveStep.mobile;
                if (newActiveStep.staffId) task.assignee_staff_ids = [newActiveStep.staffId];
                task.history.push({
                    action: `Auto-Forwarded to ${newActiveStep.name} (${newActiveStep.assignedTo})`,
                    by: worker,
                    at: new Date().toISOString(),
                    note: `Handed over next step: ${newActiveStep.stepTitle}`
                });
                await executeTaskSave(taskId, task, currentType);
            },
            async () => {
                await executeTaskSave(taskId, task, currentType);
            }
        );
    } else {
        await executeTaskSave(taskId, task, currentType);
    }
}

// Forward a task to another staff member.
async function forwardTask(taskId, currentType) {
    if (window.userRole === 'Viewer') { showToast('Viewers cannot forward tasks.', 'error'); return; }
    const res = findTaskById(taskId);
    if (!res) { showToast('Task not found', 'error'); return; }
    const { task } = res;
    if (!Array.isArray(task.history)) task.history = [];
    
    const staffId = document.getElementById('forwardAssignee').value;
    const noteVal = gv('forwardNote');
    
    if (!staffId) {
        showToast('Please select a staff member to forward to!', 'error');
        return;
    }
    
    let staff = [];
    try { staff = JSON.parse(cacheGet('staff') || '[]'); } catch(e) {}
    const member = staff.find(s => String(s.id) === String(staffId));
    if (!member) {
        showToast('Staff member not found.', 'error');
        return;
    }
    
    const worker = window.userEmail || 'admin';
    
    task.history.push({
        action: `Task Forwarded to ${member.name} (${member.role})`,
        by: worker,
        at: new Date().toISOString(),
        note: noteVal || 'No forwarding note provided'
    });
    
    task.assigned_to = member.role;
    task.name = member.name;
    task.mobile = member.mobile;
    task.next_assignee = member.role;
    task.assignee_staff_ids = [member.id];
    
    showLoading('Forwarding task...');
    try {

function setupLP(el,data){
    el.addEventListener('touchstart',e=>{lpData=data;lpTimer=setTimeout(()=>showCtxMenu(e.touches[0].clientX,e.touches[0].clientY),LP_DUR);},{passive:true});
    el.addEventListener('touchend',()=>clearTimeout(lpTimer));
    el.addEventListener('touchmove',()=>clearTimeout(lpTimer));
    el.addEventListener('contextmenu',e=>{e.preventDefault();lpData=data;showCtxMenu(e.clientX,e.clientY);});
}
// Position and show the context menu.
function showCtxMenu(x,y){const m=document.getElementById('contextMenu');m.style.left=Math.min(x,window.innerWidth-175)+'px';m.style.top=Math.min(y,window.innerHeight-160)+'px';m.classList.add('active');}
// Hide the context menu.
function hideCtxMenu(){document.getElementById('contextMenu').classList.remove('active');}
// Run an edit/delete/share context-menu action.
function handleContextAction(a){
    hideCtxMenu();if(!lpData)return;
    const{type,category,folderIndex,docIndex,index}=lpData;
    if(a==='edit'){if(type==='folder')editFolder(category,folderIndex);else if(type==='document')editDocument(category,folderIndex,docIndex);}
    else if(a==='delete'){if(type==='folder')deleteFolder(category,folderIndex);else if(type==='document')deleteDocument(category,folderIndex,docIndex);}
    else if(a==='share'){if(type==='document')shareDocument(category,folderIndex,docIndex);}
}

// Share a document via the Web Share API.
async function shareDocument(cat,fi,di){
    let folders=[];
    try { folders = JSON.parse(cacheGet(cat+'_folders')||'[]'); } catch(e) {}
    const folder = folders[fi];
    const doc = folder && folder.documents ? folder.documents[di] : null;
    if (!doc) { showToast('Document not found.', 'error'); return; }
    const imgs=(doc.images||[doc.data]).filter(Boolean);
    if(!navigator.share){showToast('Sharing not supported on this browser', 'error');return;}
    try{
        // Try sharing as files (images)
        if(imgs.length){
            const files=await Promise.all(imgs.map(async(src,idx)=>{
                const url=await getSignedImageUrl(src);
                if(!url)throw new Error('Image could not be loaded.');
                const res=await fetch(url);if(!res.ok)throw new Error('Image could not be downloaded.');
                const blob=await res.blob();
                return new File([blob],`${doc.name}_${idx+1}.jpg`,{type:blob.type||'image/jpeg'});
            }));
            if(navigator.canShare&&navigator.canShare({files})){
                await navigator.share({title:doc.name,files});return;
            }
        }
        // Fallback: share text
        await navigator.share({title:doc.name,text:`Document: ${doc.name}\n${imgs.length} image(s)`});
    }catch(e){if(e.name!=='AbortError')showToast('Share failed: ' + e.message, 'error');}
}

// Staff is exported for reference only; membership changes go through join requests.
const IMPORTABLE_KEYS = ['filesOut','returnedFiles','overdueFiles','pendingTasks','overdueTasks','completedTasks','englishFile_folders'];
// Import data from a JSON backup file.
async function handleImportFile(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
        try{
            const data=JSON.parse(ev.target.result);
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
                hideLoading();showToast('Error: Invalid backup file format!', 'error');return;
            }
            showLoading('Importing data...');
            let imported = 0;
            // Records are always imported into the signed-in company.
            const scrub = x => {
                if (!x || typeof x !== 'object' || Array.isArray(x)) return null;
                const { company_code, ...rest } = x;
                if (Array.isArray(rest.documents)) rest.documents = rest.documents.map(scrub).filter(Boolean);
                return rest;
            };
            for(const k of IMPORTABLE_KEYS){
                const v = data[k];
                if (!Array.isArray(v) || !v.length) continue;
                const rows = v.map(scrub).filter(r => r && r.id !== undefined && r.id !== null);
                if (!rows.length) continue;
                await dbSet(k, JSON.stringify(rows));
                imported += rows.length;
            }
            hideLoading();
            if (imported > 0) {
                showToast(`✓ ${imported} record(s) imported. Reloading...`, 'success');
                setTimeout(() => window.location.reload(), 1200);
            } else {
                showToast('No valid data found in file.', 'error');
            }
        }catch(err){hideLoading();showToast('Import failed: ' + (err.message || 'Invalid file format!'), 'error');}
    };
    reader.readAsText(file);e.target.value='';
}

// --- THEME LOGIC ---
function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
}

// Initialize theme
(function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
})();
